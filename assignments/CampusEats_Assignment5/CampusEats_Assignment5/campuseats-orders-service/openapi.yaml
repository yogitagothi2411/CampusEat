openapi: 3.0.3
info:
  title: CampusEats Orders Service
  description: REST API for the CampusEats Orders Service, rebuilt from the Assignment 2/3 order contract.
  version: 2.0.0
servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Orders

paths:
  /orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Accept'
        - in: query
          name: studentId
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string, enum: [PENDING, PLACED, CANCELLED]}
        - in: query
          name: sortBy
          schema: {type: string, enum: [orderId, total, createdAt, status], default: orderId}
        - in: query
          name: sortOrder
          schema: {type: string, enum: [asc, desc], default: asc}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        '200':
          description: Matching orders
          headers: {$ref: '#/components/headers/CommonRateHeaders'}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Orders]
      summary: Create an order
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MethodOverride'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreateRequest'}
      responses:
        '201':
          description: Order created or original result replayed
          headers:
            Location:
              schema: {type: string}
            Idempotency-Replayed:
              schema: {type: string, enum: ['true']}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Order'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/Unavailable'}
    options:
      tags: [Orders]
      summary: Discover supported methods and CORS policy
      responses:
        '204':
          description: No content
          headers:
            Allow: {schema: {type: string, example: 'GET, POST, OPTIONS'}}
            Access-Control-Allow-Origin: {schema: {type: string, example: '*'}}
            Access-Control-Allow-Methods: {schema: {type: string}}
            Access-Control-Allow-Headers: {schema: {type: string}}

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get one order
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Order representation
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, example: 'private, max-age=30'}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/Order'}}
        '304':
          description: Representation unchanged; no response body
          headers: {ETag: {schema: {type: string}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '406': {$ref: '#/components/responses/NotAcceptable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    options:
      tags: [Orders]
      summary: Discover methods for an order
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '204':
          description: No content
          headers: {Allow: {schema: {type: string, example: 'GET, OPTIONS'}}}

  /orders/{orderId}/cancellation:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: Cancellation is modeled as a state-changing sub-resource rather than deleting the order.
      parameters:
        - $ref: '#/components/parameters/Authorization'
        - $ref: '#/components/parameters/Accept'
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/MethodOverride'
      responses:
        '200':
          description: Order cancelled
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, example: 'no-store'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    options:
      tags: [Orders]
      summary: Discover cancellation methods
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '204':
          description: No content
          headers: {Allow: {schema: {type: string, example: 'POST, OPTIONS'}}}

components:
  parameters:
    Authorization:
      in: header
      name: Authorization
      required: true
      schema: {type: string, example: 'Bearer campuseats-demo-token'}
    Accept:
      in: header
      name: Accept
      required: false
      schema: {type: string, example: application/json}
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: {type: string}
      description: Reuse the same key after a lost response to obtain the original result without repeating payment/order work.
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      schema: {type: string}
      description: Return 304 when the representation has not changed.
    IfMatch:
      in: header
      name: If-Match
      required: false
      schema: {type: string}
      description: Prevent an update when the client holds a stale ETag.
    MethodOverride:
      in: header
      name: X-HTTP-Method-Override
      required: false
      schema: {type: string, enum: [GET, POST, PUT, PATCH, DELETE]}
      description: Compatibility fallback for clients/proxies that can only send POST. It must map to a method supported by the target route.
    OrderId:
      in: path
      name: orderId
      required: true
      schema: {type: integer, minimum: 1}

  headers:
    CommonRateHeaders:
      X-RateLimit-Limit: {schema: {type: integer}}
      X-RateLimit-Remaining: {schema: {type: integer}}

  responses:
    BadRequest:
      description: Malformed request
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthorized:
      description: Missing or invalid bearer token
      headers: {WWW-Authenticate: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Order not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotAcceptable:
      description: Unsupported response media type
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: Business or idempotency conflict
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PreconditionFailed:
      description: If-Match precondition failed
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unprocessable:
      description: Domain rule refused the request
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    TooManyRequests:
      description: Per-client rate limit exceeded
      headers:
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unavailable:
      description: Payment service unavailable after retries
      content: {application/json: {schema: {$ref: '#/components/schemas/Problem'}}}

  schemas:
    OrderCreateRequest:
      type: object
      required: [studentId, items, addressId, paymentMethod]
      properties:
        studentId: {type: string}
        addressId: {type: integer}
        paymentMethod: {type: string, enum: [CARD, UPI, WALLET, COD]}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity]
            properties:
              itemId: {type: integer}
              quantity: {type: integer, minimum: 1}
    Order:
      type: object
      required: [orderId, studentId, addressId, paymentMethod, status, total, items, createdAt]
      properties:
        orderId: {type: integer}
        studentId: {type: string}
        addressId: {type: integer}
        paymentMethod: {type: string}
        status: {type: string, enum: [PENDING, PLACED, CANCELLED]}
        total: {type: number, format: float}
        items:
          type: array
          items:
            type: object
            properties:
              itemId: {type: integer}
              quantity: {type: integer}
              unitPrice: {type: number, format: float}
        createdAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
